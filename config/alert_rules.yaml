alerts:
  - name: HighLatencyP95
    severity: critical
    condition: "p95(latency_ms) > 3000ms for 5m"
    type: symptom-based
    owner: On-Call Engineer
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: high
    condition: "error_rate_pct > 2% for 5m"
    type: symptom-based
    owner: API Team
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: "mean(quality_score) < 0.75 for 10m"
    type: symptom-based
    owner: AI Quality Team
    runbook: docs/alerts.md#alert-3